<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>MYkrokosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Apple-style product site — translucent global nav, big headline per view, soft grey tiles; the constellation lives in one deep night-sky tile. */
:root{
  --bg:#ffffff; --tile:#f5f5f7; --card:#ffffff;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b; --line:#d2d2d7; --chip:#e8e8ed;
  --accent:#0071e3; --accent-fg:#ffffff; --link:#0066cc;
  --nav:rgba(251,251,253,.82); --scrim:rgba(0,0,0,.42);
  --ok:#1d7d3a; --ok-bg:#e3f4e8; --grow:#a15c00; --grow-bg:#fdf0dc; --need:#c4122e; --need-bg:#fde7ea;
  --star-on:#ff9f0a; --star-off:#d2d2d7;
  --sky:#04060c; --sky-2:#0b1226; --sky-fg:#f5f5f7; --sky-dim:rgba(245,245,247,.55);
  --exp:#ffe3a3;
  --f-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --r-tile:28px; --r-card:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --tile:#161618; --card:#1d1d1f;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#86868b; --line:#3a3a3c; --chip:#2c2c2e;
  --accent:#0a84ff; --accent-fg:#ffffff; --link:#2997ff;
  --nav:rgba(22,22,23,.82); --scrim:rgba(0,0,0,.6);
  --ok:#30d158; --ok-bg:#0f2a17; --grow:#ffb340; --grow-bg:#2e2108; --need:#ff6961; --need-bg:#3a1214;
  --star-on:#ffb340; --star-off:#48484a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --tile:#161618; --card:#1d1d1f;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#86868b; --line:#3a3a3c; --chip:#2c2c2e;
  --accent:#0a84ff; --accent-fg:#ffffff; --link:#2997ff;
  --nav:rgba(22,22,23,.82); --scrim:rgba(0,0,0,.6);
  --ok:#30d158; --ok-bg:#0f2a17; --grow:#ffb340; --grow-bg:#2e2108; --need:#ff6961; --need-bg:#3a1214;
  --star-on:#ffb340; --star-off:#48484a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-sans);font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.nav-inner{max-width:1080px;margin-inline:auto;display:flex;align-items:center;gap:8px;height:52px;padding-inline:16px}
.brand{font-weight:700;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand svg{width:20px;height:20px}
.nav-links{display:flex;gap:2px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav-links::-webkit-scrollbar{display:none}
.nav-links button{background:none;border:0;padding:6px 12px;font-size:13px;color:var(--fg-2);border-radius:999px;white-space:nowrap}
.nav-links button:hover{color:var(--fg)}
.nav-links button[aria-current="page"]{color:var(--fg);background:var(--chip)}
.nav-cta{white-space:nowrap}

main{padding-inline:16px;padding-block:0 96px}
.wrap{max-width:1080px;margin-inline:auto}
.view{display:flex;flex-direction:column;gap:28px}
.hero{padding-block:56px 8px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:14px;font-weight:600;color:var(--fg-2);letter-spacing:0}
.hero h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;line-height:1.07;letter-spacing:-.035em}
.hero p.lead{font-size:clamp(17px,2vw,21px);color:var(--fg-2);max-width:40em;line-height:1.38}

.tile{background:var(--tile);border-radius:var(--r-tile);padding:clamp(20px,3.4vw,40px);min-width:0}
.tile h2{font-size:clamp(22px,2.6vw,28px);font-weight:700}
.tile .sub{color:var(--fg-2);font-size:15px;margin-top:4px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:0;padding:9px 18px;font-size:15px;font-weight:500;line-height:1.2;transition:background .15s,opacity .15s}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn-secondary{background:transparent;color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}
.btn-secondary:hover{background:color-mix(in srgb,var(--link) 8%,transparent)}
.btn-quiet{background:var(--chip);color:var(--fg)}
.btn-danger{background:transparent;color:var(--need)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
.link{background:none;border:0;padding:0;color:var(--link);font-size:inherit}
.link:hover{text-decoration:underline}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 11px;font-size:13px;background:var(--chip);color:var(--fg);border:1px solid transparent;line-height:1.4;white-space:nowrap}
button.chip:hover{border-color:var(--line)}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip.ghost{background:transparent;border:1px dashed var(--line);color:var(--fg-2)}
.chip .x{opacity:.7;font-size:15px;line-height:1;margin-left:2px}
.chip small{opacity:.7;font-size:11px}

/* sky */
.sky,.night{background:radial-gradient(60% 55% at 18% 20%,rgba(70,90,255,.28),transparent 60%),radial-gradient(45% 50% at 88% 85%,rgba(47,211,255,.16),transparent 60%),radial-gradient(40% 45% at 70% 25%,rgba(190,120,255,.14),transparent 60%),radial-gradient(120% 90% at 50% 0%,#0d1530,#04060c 72%);}
.sky{position:relative;border-radius:var(--r-tile);height:clamp(460px,72vh,780px);overflow:hidden;color:var(--sky-fg);color-scheme:dark}
#graph-svg{position:relative;width:100%;height:100%;display:block;cursor:grab}
#graph-svg:active{cursor:grabbing}
.sky-tools{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.sky-tools>*{pointer-events:auto}
.sky-btn{background:rgba(255,255,255,.1);color:var(--sky-fg);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:999px;padding:7px 14px;font-size:13px}
.sky-btn:hover{background:rgba(255,255,255,.18)}
.sky-btn[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#000}
#graph-bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.sky-tip{position:absolute;z-index:3;pointer-events:none;padding:6px 11px;border-radius:9px;background:rgba(245,245,247,.96);color:#0b1020;font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.sky-tip small{font-weight:500;color:#5a6378;margin-left:6px}
.sky-panel{position:absolute;z-index:2;left:16px;top:64px;width:min(320px,calc(100% - 32px));max-height:calc(100% - 32px);background:rgba(16,20,36,.92);box-shadow:0 24px 60px rgba(0,0,0,.55);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px;font-size:14px;transition:left .15s,top .15s}
.sky-panel h3{font-size:20px}
.sky-panel .muted{color:var(--sky-dim)}
.sky-panel .chip{background:rgba(255,255,255,.12);color:var(--sky-fg)}
.sky-panel .list-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;width:100%;font-size:14px}
.sky-panel .list-item:hover{color:#fff}
.sky-panel .close{position:absolute;top:12px;right:12px}
@media (prefers-reduced-motion: reduce){.sky-panel{transition:none}}
.sky-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:24px}
.sky-empty>div{pointer-events:auto;text-align:center;max-width:420px;display:flex;flex-direction:column;gap:12px;align-items:center}
.sky-empty h3{font-size:28px;font-weight:700}
.sky-empty p{color:var(--sky-dim)}
.sky-empty.compact{align-items:flex-end;padding-bottom:64px}
.sky-empty.compact>div{max-width:520px;background:rgba(10,14,28,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px 24px;gap:8px}
.sky-empty.compact h3{font-size:20px}
.sky-empty.compact p{font-size:15px}
.node{cursor:pointer;outline:none}
/* a star's wide glow and the lines let the pointer through, so empty spots inside a zone grab the zone */
#graph-svg .glow,#graph-links{pointer-events:none}
.zone-name,.zone-area{cursor:grab}
.zone-name:active,.zone-area:active{cursor:grabbing}
.node .ret{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:0;transition:opacity .15s}
.node:focus-visible .ret{opacity:.9;stroke:#2997ff}
.node.selected .ret{opacity:1}
.newbloom{transform-box:fill-box;transform-origin:center;animation:newbloom 2.6s ease-in-out infinite}
@keyframes newbloom{50%{opacity:.55;transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){.newbloom{animation:none}}
.grad{background:linear-gradient(90deg,#2f6bff,#2fb8ff 55%,#3fd6a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sky-search{margin-left:auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .15s,border-color .15s}
.sky-search:focus-within{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.sky-search svg{width:13px;height:13px;flex:none;opacity:.7}
.sky-search input{background:transparent;border:0;color:#fff;font-size:13px;width:150px;padding:0;outline:none}
.sky-search input::placeholder{color:rgba(245,245,247,.55)}
.sky-search input::-webkit-search-cancel-button{filter:invert(1)}
.sky-search .cnt{font-size:12px;color:rgba(245,245,247,.65);white-space:nowrap;padding-right:6px;font-variant-numeric:tabular-nums}
.node.found .ret{opacity:.95;stroke:#ffd23f}
.sky-seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.sky-seg button{border:0;border-radius:999px;padding:7px 14px;font-size:13px;color:#fff;background:transparent}
.sky-seg button:hover{background:rgba(255,255,255,.12)}
.sky-seg button[aria-pressed="true"]{color:#000;background:rgba(255,255,255,.9)}
.starlight{display:flex;flex-direction:column;gap:18px}
.sl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.sl-chip{background:#0d1428;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:15px;font-weight:600}
.sl-chip i{width:13px;height:13px;border-radius:50%;flex:none}
.sl-marks{display:flex;gap:10px 26px;flex-wrap:wrap;font-size:14px;color:var(--fg-2)}
.sl-marks span{display:inline-flex;align-items:center;gap:8px}
.tdot{width:8px;height:8px;border-radius:50%;display:inline-block;align-self:center;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.sky-panel .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.welcome{display:flex;flex-direction:column;gap:16px;padding-top:28px}
.welcome .mark{width:44px;height:44px;color:var(--link)}
.welcome h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.welcome p.lead{color:var(--fg-2);font-size:16px}
.node text{pointer-events:none;paint-order:stroke;stroke:rgba(4,6,12,.85);stroke-width:3px}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
@media (prefers-reduced-motion: reduce){.twinkle{animation:none}}

/* records */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.input,.select,textarea.input{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:15px;min-width:0}
.input:focus,.select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search{flex:1 1 220px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.rcard{background:var(--tile);border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left;border:0;color:inherit;min-width:0;transition:transform .2s}
.rcard:hover{transform:translateY(-2px)}
.rcard .meta{font-size:12px;color:var(--fg-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rcard h3{font-size:19px;font-weight:700;line-height:1.3}
.rcard .ex{font-size:14px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard .rates{display:flex;gap:14px;font-size:12px;color:var(--fg-2);margin-top:auto;flex-wrap:wrap}
.mini-stars{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.mini-stars b{color:var(--star-on);font-weight:600}
.empty{text-align:center;padding:56px 20px;color:var(--fg-2);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{color:var(--fg);font-size:22px}

/* stars input */
.stars{display:inline-flex;align-items:center;gap:2px;user-select:none}
.star{position:relative;width:28px;height:28px;display:inline-block;cursor:pointer}
.star svg{width:28px;height:28px;display:block}
.star .s-bg{fill:var(--star-off)}
.star .s-fill{position:absolute;inset:0 auto 0 0;overflow:hidden}
.star .s-fill svg path{fill:var(--star-on)}
.stars-val{margin-left:8px;font-weight:600;font-variant-numeric:tabular-nums;min-width:2.2em}
.stars.ro .star{width:16px;height:16px;cursor:default}
.stars.ro .star svg{width:16px;height:16px}
.stars.ro .stars-val{font-size:13px;margin-left:4px}

/* modal */
.layer{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet{background:var(--bg);color:var(--fg);border-radius:24px;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet.narrow{width:min(520px,100%)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px;gap:12px}
.sheet-head h2{font-size:24px;font-weight:700}
.sheet-body{padding:8px 24px 24px;overflow:auto;min-height:0}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-foot .spacer{flex:1}
.icon-btn{background:var(--chip);border:0;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-2);flex:none}
.editor{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
@media (max-width:820px){.editor{grid-template-columns:1fr}}
.ed-main,.ed-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.ed-title{font-size:26px;font-weight:700;border:0;border-bottom:1px solid var(--line);padding:6px 0;background:transparent;width:100%;letter-spacing:-.02em}
.ed-title:focus{outline:none;border-color:var(--accent)}
.ed-row{display:flex;gap:12px;flex-wrap:wrap}
.ed-row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg-2);flex:1 1 160px}
textarea.input{width:100%;resize:vertical;line-height:1.6;font-size:16px}
#ed-body{min-height:180px}
.guide-box{background:var(--tile);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.guide-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;font-weight:600;font-size:15px}
.guide-head small{font-weight:400;color:var(--fg-2);font-size:13px}
.guide-field label{font-size:13px;color:var(--fg-2);display:block;margin-bottom:4px}
.guide-field textarea{min-height:64px;font-size:15px}
.ask-card{background:var(--card);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);text-align:left;width:100%}
.ask-card:hover{border-color:var(--accent)}
.ask-card span.add{color:var(--link);font-size:13px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:8px}
.field-label{font-size:13px;font-weight:600;color:var(--fg-2)}
.field-hint{font-size:12px;color:var(--fg-3)}
.file-drop{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--link);font-size:14px;cursor:pointer;background:var(--card)}
.file-drop:hover{border-color:var(--accent)}
.att-list{display:flex;flex-wrap:wrap;gap:10px}
.att{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg-2);text-align:center;padding:6px;word-break:break-all}
.att img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.att .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;font-size:13px;z-index:1}
.side-card{background:var(--tile);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tag-input{display:flex;gap:8px}
.tag-input .input{flex:1}

/* detail */
.detail{display:flex;flex-direction:column;gap:20px}
.detail .body{white-space:pre-wrap;font-size:16px;line-height:1.7}
.detail .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.detail .kv>div{background:var(--tile);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg-2)}
.qa{border-left:2px solid var(--line);padding-left:14px}
.qa b{display:block;font-size:13px;color:var(--fg-2);font-weight:600;margin-bottom:2px}

/* ability */
.ability{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.ability{grid-template-columns:1fr}}
.radar text{font-size:12px}
.radar .grid{fill:none;stroke:rgba(255,255,255,.14)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stat-row{display:grid;grid-template-columns:minmax(80px,8em) 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stat-row:first-child{border-top:0}
.stat-name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.stat-sub{font-size:12px;color:var(--fg-2);grid-column:2/4}
.bar{height:8px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.stack{display:flex}
.bar.stack i{border-radius:0;flex:none}
/* night tiles: the same sky as the constellation, for the chart screens */
.night{position:relative;overflow:hidden;color:#f5f5f7;color-scheme:dark}

.night h2,.night .insight{color:#f5f5f7}
.night .sub,.night .field-hint{color:rgba(245,245,247,.6)}

.night .seg button{color:rgba(245,245,247,.7)}

.night .stat-row{border-color:rgba(255,255,255,.08)}
.night .stat-sub{color:rgba(245,245,247,.55)}
.night .bar{background:rgba(255,255,255,.08)}
.night .empty{color:rgba(245,245,247,.6)}
.ab-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.ab-heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}

.ab-num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#4f8bff,#2fb8ff 55%,#3fd6a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ab-meta{font-size:12px;color:rgba(245,245,247,.6)}
.ab-legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:12px;color:rgba(245,245,247,.7)}
.ab-legend span{display:inline-flex;align-items:center;gap:6px}
.ab-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ab-legend.light{color:var(--fg-2);margin-top:12px}
.tl-inner{position:relative;min-width:640px}
.tl-tip{position:absolute;top:10px;pointer-events:none;background:rgba(14,18,34,.94);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:12px;color:#f5f5f7;min-width:150px;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tl-tip b{font-size:13px}
.tl-tip span{display:flex;justify-content:space-between;gap:12px}
.tl-tip i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.night .firsts>div{background:rgba(255,255,255,.06);color:rgba(245,245,247,.6)}
.night .firsts b{color:#f5f5f7}
.sem-dots{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:16px}
.sem-dots i{border-radius:50%;display:inline-block}
.sem li button{display:flex;align-items:center;gap:6px}
.type-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:16px;background:var(--chip)}
.type-bar i{height:100%;flex:none}
.stat-val{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.insight{font-size:clamp(19px,2.2vw,24px);font-weight:600;line-height:1.4;letter-spacing:-.02em}
.insight em{font-style:normal;color:var(--link)}

/* timeline */
.chart-wrap{overflow-x:auto}
.tl-chart{min-width:640px;width:100%;display:block}
.tl-chart text{font-size:11px}
.firsts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.firsts>div{background:var(--card);border-radius:14px;padding:14px;font-size:13px;color:var(--fg-2);display:flex;flex-direction:column;gap:2px}
.firsts b{color:var(--fg);font-size:15px}
.sems{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.sem{flex:0 0 min(280px,85%);scroll-snap-align:start;background:var(--tile);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:10px}
.sem h3{font-size:19px}
.sem .cnt{font-size:13px;color:var(--fg-2)}
.sem ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sem li button{background:none;border:0;padding:4px 0;text-align:left;font-size:14px;color:var(--fg);width:100%}
.sem li button:hover{color:var(--link)}
.sem li small{color:var(--fg-3);font-variant-numeric:tabular-nums;margin-right:6px}

/* goal */
.goal-form{display:flex;flex-direction:column;gap:16px}
.goal-name{font-size:clamp(24px,3vw,32px);font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;width:100%;letter-spacing:-.02em}
.goal-name:focus{outline:none;border-color:var(--accent)}
.gap-list{display:flex;flex-direction:column}
.gap-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.gap-row:first-child{border-top:0}
.gap-row .t{font-weight:600;font-size:17px}
.gap-row .d{font-size:13px;color:var(--fg-2)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.grow{background:var(--grow-bg);color:var(--grow)}
.pill.need{background:var(--need-bg);color:var(--need)}
.pill.virt{background:var(--chip);color:var(--fg-2)}
.cover{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cover svg{flex:none}
.vlist{display:flex;flex-direction:column}
.vrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.vrow:first-child{border-top:0}
.vrow .nm{font-weight:600;flex:1;min-width:120px}
.vdot{width:10px;height:15px;border-radius:50%;border:1.8px solid #5b8fd6;flex:none;transform:rotate(25deg)}
.vdot.real{width:12px;height:12px;border:0;background:#ffd23f;box-shadow:0 0 8px #ffd23f;transform:none}

/* summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}

.num-tile .n{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;background:linear-gradient(90deg,#2f6bff,#2fb8ff 55%,#3fd6a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.num-tile .n small{font-size:18px;font-weight:600;margin-left:2px}
.num-tile .l{font-size:14px;color:var(--fg-2)}
.rank{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}
.rank li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .no{font-weight:800;color:var(--fg-3);font-variant-numeric:tabular-nums;width:1.2em}
.rank button{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:16px;flex:1;color:var(--fg)}
.rank button:hover{color:var(--link)}
.cloud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-top:16px}
.cloud span{font-weight:700;letter-spacing:-.02em;line-height:1.2}
.cloud small{font-size:12px;color:var(--fg-3);font-weight:500;margin-left:3px}
.analysis{position:relative;overflow:hidden;background:var(--sky);color:var(--sky-fg);border-radius:var(--r-tile);padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;gap:18px;background-image:radial-gradient(90% 120% at 100% 0%,var(--sky-2),transparent 60%)}
.analysis .eyebrow{color:var(--sky-dim)}
.analysis p.txt{font-size:clamp(20px,2.6vw,30px);font-weight:600;line-height:1.45;letter-spacing:-.025em;max-width:30em}
.analysis p.txt mark{background:none;color:var(--exp)}
.analysis .note{font-size:13px;color:var(--sky-dim)}

/* settings */
.set-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.set-row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg-2);flex:1 1 200px}
.cat-row{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-top:1px solid var(--line)}

.cat-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.map-table{width:100%;border-collapse:collapse;font-size:14px}

.map-table td:first-child{font-weight:600;white-space:nowrap;width:1%}
.map-wrap{overflow-x:auto}

.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease-out}

.tour{position:fixed;inset:0;z-index:80;overscroll-behavior:contain;touch-action:none}
.tour.pass{pointer-events:none}
.tour.pass .tour-card{pointer-events:auto}

.sky.viewing{position:fixed;inset:0;height:auto;border-radius:0;z-index:55}

@keyframes shoot{0%{opacity:0;transform:translate(0,0)}12%{opacity:.95}100%{opacity:0;transform:translate(340px,145px)}}

html{scrollbar-gutter:stable}
.tour-spot{position:fixed;border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.58);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-card{position:fixed;width:min(380px,calc(100vw - 32px));background:var(--bg);color:var(--fg);border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;transition:top .35s,left .35s}

.banner{background:var(--grow-bg);color:var(--grow);font-size:13px;text-align:center;padding:8px 16px}

};
function hintKeywords(name){
  let kws = [name];
  for (const [k, v] of Object.entries(DOMAIN_HINTS)) if (name.includes(k)) kws = kws.concat(v);

}

/* ---------- state ---------- */
const KEY = 'byeoljari.v1';
let storageOK = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch { storageOK = false; }
const emptyState = () => ({ version:1, tutorialDone:false, profile:{ name:'', majors:[] }, categories:[], experiences:[], tagCats:{}, goal:{ name:'', areas:[] }, virtuals:[] });
let state = emptyState();
let demo = false;          // true while the tutorial shows the sample student
let realState = null;      // the viewer's own data, parked during the tutorial
let view = 'graph';

function load(){
  if (!storageOK) return null;
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function save(){
  if (demo || !storageOK) return true;
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; } catch { return false; }
}
function commit(fn){
  const snap = JSON.stringify(state);
  const out = fn();
  if (!save()) { state = JSON.parse(snap); toast('저장 공간이 부족해 저장하지 못했어요. 첨부 파일을 줄이고 다시 시도해 주세요.'); return false; }
  return out === undefined ? true : out;
}
function remember(k, v){ try { localStorage.setItem('byeoljari.ui.' + k, v); } catch {} }
function recall(k){ try { return localStorage.getItem('byeoljari.ui.' + k); } catch { return null; } }

/* ---------- derived data ---------- */
const exps = () => [...state.experiences].sort((a, b) => a.date < b.date ? 1 : -1);
const expById = id => state.experiences.find(e => e.id === id);
const catById = id => state.categories.find(c => c.id === id);
function allTags(){
  const m = new Map();
  for (const e of state.experiences) for (const t of e.tags) { const k = norm(t); if (!m.has(k)) m.set(k, {name:t, exps:[]}); m.get(k).exps.push(e); }
  return [...m.values()];
}
function catsForTag(tag){
  const ov = state.tagCats[tag];
  if (Array.isArray(ov)) return ov.filter(id => catById(id));
  return state.categories.filter(c => c.keywords.some(k => norm(k) === norm(tag))).map(c => c.id);
}
function catsForExp(e){
  const auto = uniq(e.tags.flatMap(catsForTag));
  return uniq(auto.concat(e.catAdd || [])).filter(id => !(e.catRemove || []).includes(id) && catById(id));
}
const score = e => (e.importance + e.growth) / 2;
function labelMatches(label, e){
  const n = norm(label);
  return e.tags.some(t => norm(t) === n) || (n.length >= 2 && norm(e.title).includes(n));
}
function semOf(d){
  const y = +d.slice(0,4), m = +d.slice(5,7), yy = String(y).slice(2), py = String(y-1).slice(2);
  if (m >= 3 && m <= 6) return {key:`${y}-1`, name:`${y}년 1학기`, short:`${yy}·1학기`, order:y*10+1};
  if (m >= 7 && m <= 8) return {key:`${y}-2s`, name:`${y}년 여름방학`, short:`${yy}·여름`, order:y*10+2};
  if (m >= 9) return {key:`${y}-3`, name:`${y}년 2학기`, short:`${yy}·2학기`, order:y*10+3};
  return {key:`${y-1}-4w`, name:`${y-1}년 겨울방학`, short:`${py}·겨울`, order:(y-1)*10+4};
}
function abilityStats(mode){
  const rows = [];
  if (mode === 'cat') {
    for (const c of state.categories) {
      const es = state.experiences.filter(e => catsForExp(e).includes(c.id));
      if (es.length) rows.push(statRow(c.name, es));
    }
  } else {
    for (const t of allTags()) rows.push(statRow(t.name, t.exps));
  }
  return rows.sort((a, b) => b.points - a.points || b.count - a.count);
}
function statRow(name, es){
  const points = es.reduce((s, e) => s + e.growth, 0);
  const byType = {};
  for (const e of es) byType[lightOf(e)] = (byType[lightOf(e)] || 0) + e.growth;
  return { name, count: es.length, points, byType, high: es.filter(e => e.growth >= 4).length, avg: points / es.length };
}

/* ---------- toast / modal / confirm ---------- */
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3600);
}
function openModal(html, cls = '', locked = false){
  const root = $('#modal-root');
  root.innerHTML = `<div class="layer" data-layer ${locked ? 'data-locked' : ''}><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  const layer = root.firstElementChild;
  if (!locked) layer.addEventListener('mousedown', e => { if (e.target === layer) closeModal(); });
  $$('[data-close]', layer).forEach(b => b.addEventListener('click', closeModal));
  document.body.style.overflow = 'hidden';
  return layer;
}
function closeModal(){ $('#modal-root').innerHTML = ''; document.body.style.overflow = ''; }
function ask(msg, ok = '확인', danger = false){
  return new Promise(res => {
    const root = $('#confirm-root');
    root.innerHTML = `<div class="layer" style="z-index:70"><div class="sheet narrow" role="alertdialog" aria-modal="true"><div class="sheet-body" style="padding-top:24px"><p style="font-size:17px">${msg}</p></div><div class="sheet-foot"><button class="btn btn-quiet" data-a="0">취소</button><button class="btn ${danger ? 'btn-primary" style="background:var(--need)' : 'btn-primary'}" data-a="1">${esc(ok)}</button></div></div></div>`;
    $$('[data-a]', root).forEach(b => b.addEventListener('click', () => { root.innerHTML = ''; res(b.dataset.a === '1'); }));
    $('[data-a="1"]', root).focus();
  });
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#graph.viewing')) { exitViewing(); return; }
  if ($('#confirm-root').innerHTML) { $('#confirm-root').innerHTML = ''; return; }
  if ($('#modal-root').innerHTML && !$('#modal-root [data-locked]')) closeModal();
});

/* ---------- stars widget ---------- */
function fillPct(v, i){ return clamp((v - (i - 1)) * 100, 0, 100); }
function starsHTML(id, v, ro = false){
  return `<div class="stars${ro ? ' ro' : ''}" ${id ? `id="${id}"` : ''} ${ro ? `aria-label="별점 ${v}점"` : `role="slider" tabindex="0" aria-valuemin="0.5" aria-valuemax="5" aria-valuenow="${v}" aria-valuetext="${v}점"`} data-v="${v}">${
    [1,2,3,4,5].map(i => `<span class="star" data-i="${i}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="s-bg" d="${STAR}"/></svg><span class="s-fill" style="width:${fillPct(v, i)}%"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR}"/></svg></span></span>`).join('')
  }<span class="stars-val">${Number(v).toFixed(1)}</span></div>`;
}
function paintStars(el, v){
  $$('.star', el).forEach(s => { $('.s-fill', s).style.width = fillPct(v, +s.dataset.i) + '%'; });
  $('.stars-val', el).textContent = Number(v).toFixed(1);
}
function bindStars(el, onChange){
  const valAt = ev => { const s = ev.target.closest('.star'); if (!s) return null; const r = s.getBoundingClientRect(); return +s.dataset.i - (ev.clientX - r.left < r.width / 2 ? .5 : 0); };
  const set = v => { v = clamp(v, .5, 5); el.dataset.v = v; el.setAttribute('aria-valuenow', v); el.setAttribute('aria-valuetext', v + '점'); paintStars(el, v); onChange(v); };
  el.addEventListener('mousemove', ev => { const v = valAt(ev); if (v) paintStars(el, v); });
  el.addEventListener('mouseleave', () => paintStars(el, +el.dataset.v));
  el.addEventListener('click', ev => { const v = valAt(ev); if (v) set(v); });
  el.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { ev.preventDefault(); set(+el.dataset.v + .5); }
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { ev.preventDefault(); set(+el.dataset.v - .5); }
  });
}
const miniStars = (label, v) => `<span class="mini-stars">${label} <b>★ ${Number(v).toFixed(1)}</b></span>`;

/* ================= GRAPH ================= */
// Star colours: one hue per activity type, so a glance tells what kind of experience a star is.
const STARLIGHT = { blue:['#6aa8ff','#a9ccff'], violet:['#c6b6ff','#ddd3ff'], lime:['#c6f4a3','#e1fac9'], gold:['#ffe59a','#fff1c6'], teal:['#a3efe3','#cdf8f1'], orange:['#ffc79e','#ffdfc6'], pink:['#ffb3c6','#ffd6e0'], silver:['#d9dee8','#e6eaf2'] };
const TYPE_LIGHT = { '공모전':'blue', '프로젝트':'violet', '수업':'violet', '동아리':'lime', '대외활동':'teal', '봉사':'orange', '인턴':'gold', '아르바이트':'silver', '개인 경험':'pink', '기타':'silver' };
const LIGHT_LEGEND = [['공모전','blue'],['수업 · 프로젝트','violet'],['동아리','lime'],['인턴','gold'],['대외활동','teal'],['봉사','orange'],['개인 경험·여행','pink'],['아르바이트 · 기타','silver']];
const lightOf = e => TYPE_LIGHT[e.type] || 'silver';
// Score 0.5–5 → radius ~3–14.5px; the curve widens the gap so big experiences stand out at a glance.
const starRadius = sc => (2.5 + Math.pow(sc / 5, 1.4) * 12) * 1.25;
const starOf = e => STARLIGHT[lightOf(e)];

let sim = null, zoomT = null, showLabels = recall('labels') !== '0', showLines = recall('lines') !== '0';

// keyword search in the sky: matching stars stay bright, Enter flies to them one by one
let searchQ = '', searchIdx = -1;
function nodeMatches(d, q){
  if (d.type === 'exp') { const e = d.ref; return norm([e.title, e.body, e.type, ...e.tags, ...Object.values(e.guide || {})].join(' ')).includes(q); }
  return norm(d.label).includes(q);
}
function searchHits(){
  const q = norm(searchQ); if (!q || !graphApi) return [];
  const order = { exp: 0, virt: 1, tag: 2 };
  return graphApi.nodes.filter(d => nodeMatches(d, q)).sort((a, b) => order[a.type] - order[b.type]);
}
function applySearch(){
  const cnt = $('#g-search-cnt'); if (!graphApi) return;
  const { node, linkG } = graphApi, q = norm(searchQ);
  if (!q) { if (cnt) cnt.textContent = ''; node.classed('found', false); searchQ = ''; graphFocus(panelNode); return; }
  const hits = new Set(searchHits().map(d => d.id));
  if (cnt) cnt.textContent = hits.size ? `${hits.size}개` : '없음';
  node.classed('found', d => hits.has(d.id)).attr('opacity', d => hits.has(d.id) ? 1 : .12);
  linkG.selectAll('.lnk').attr('opacity', d => hits.has(d.source.id) || hits.has(d.target.id) ? .55 : .03);
}
function jumpToMatch(dir){
  const hits = searchHits(); if (!hits.length || !graphApi) return;
  searchIdx = (searchIdx + dir + hits.length) % hits.length;
  const d = hits[searchIdx], { svg, zoom } = graphApi;
  svg.transition().duration(650).call(zoom.translateTo, d.x, d.y);
  openPanel(d); applySearch();
  const cnt = $('#g-search-cnt'); if (cnt) cnt.textContent = `${searchIdx + 1} / ${hits.length}`;
}

function buildGraph(){
  const nodes = [], links = [], idx = new Map();
  const add = n => { if (!idx.has(n.id)) { idx.set(n.id, n); nodes.push(n); } return idx.get(n.id); };
  for (const t of allTags()) add({ id:'t:' + norm(t.name), type:'tag', label:t.name, count:t.exps.length });
  for (const e of state.experiences) {
    add({ id:'e:' + e.id, type:'exp', label:e.title, ref:e });
    for (const t of e.tags) links.push({ source:'e:' + e.id, target:'t:' + norm(t), kind:'et' });
  }
  for (const v of state.virtuals.filter(v => !v.realizedAt)) {
    add({ id:'v:' + v.id, type:'virt', label:v.label, ref:v });
    for (const l of v.links) if (idx.has('t:' + norm(l))) links.push({ source:'v:' + v.id, target:'t:' + norm(l), kind:'v' });
  }
  for (const n of nodes) {
    n.r = n.type === 'exp' ? starRadius(score(n.ref)) : n.type === 'tag' ? 1.6 : 3;
    const p = posCache.get(n.id);
    if (p) { n.x = p.x; n.y = p.y; } else { n.x = (Math.random() - .5) * 300; n.y = (Math.random() - .5) * 300; }
  }
  return { nodes, links };
}

  d3.selectAll([...nameEl.values()]).attr('class', 'zone-name').call(zoneDrag((e, k) => k));
  zoneG.select('ellipse').attr('class', 'zone-area').call(zoneDrag((e, k) => zoneAt(e.x, e.y, k))).on('click', () => closePanel());
  if (panelNode) { const pn = nodes.find(n => n.id === panelNode); if (pn) { openPanel(pn); focus(pn.id); } else closePanel(); }

// 감상 모드 연출: star layers drift at two speeds, the constellation sways slowly, now and then a shooting star.
let skyLayers = [], driftRAF = null, shootTimer = null;
function startDrift(){
  stopDrift();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now();
  const step = now => {
    const t = (now - t0) / 1000;
    for (const L of skyLayers) L.el.setAttribute('transform', `translate(${(t * L.speed) % L.W},0)`);
    const d = $('#drift'); if (d) d.setAttribute('transform', `translate(${(Math.sin(t / 19) * 36).toFixed(2)},${(Math.sin(t / 27) * 22).toFixed(2)})`);
    driftRAF = requestAnimationFrame(step);
  };
  driftRAF = requestAnimationFrame(step);
  const shoot = () => {
    const host = $('#shooting'), wrap = $('#graph');
    if (host && wrap) {
      const W = wrap.clientWidth, H = wrap.clientHeight, x = (Math.random() - .7) * W, y = (Math.random() - .9) * H / 2, len = 90 + Math.random() * 80;
      const ns = 'http://www.w3.org/2000/svg', el = document.createElementNS(ns, 'line');
      el.setAttribute('x1', x); el.setAttribute('y1', y); el.setAttribute('x2', x - len); el.setAttribute('y2', y - len * .42);
      el.setAttribute('class', 'shoot');
      host.appendChild(el); setTimeout(() => el.remove(), 1700);
    }
    shootTimer = setTimeout(shoot, 5000 + Math.random() * 7000);
  };
  shootTimer = setTimeout(shoot, 2500);
}
function stopDrift(){
  cancelAnimationFrame(driftRAF); driftRAF = null; clearTimeout(shootTimer); shootTimer = null;
  for (const L of skyLayers) L.el.removeAttribute('transform');
  const d = $('#drift'); if (d) d.removeAttribute('transform');
}

function extractTags(text){
  const t = text.toLowerCase(), hits = [];
  for (const [tag, trig] of Object.entries(DICT)) {
    const n = trig.reduce((s, k) => s + (t.split(k.toLowerCase()).length - 1), 0);
    if (n) hits.push({ tag, n });
  }
  const nt = norm(text);
  for (const at of allTags()) if (norm(at.name).length >= 2 && nt.includes(norm(at.name)) && !hits.some(h => norm(h.tag) === norm(at.name))) hits.push({ tag: at.name, n: 1.5 });
  return hits.sort((a, b) => b.n - a.n).map(h => h.tag);
}
const ASPECTS = [
  { re:/역할|맡|담당|팀장|리더/, q:['그 활동에서 내가 맡은 역할은 무엇이었나요?','팀 안에서 나는 주로 어떤 일을 했나요?'] },
  { re:/어려|힘들|고민|문제|실패|막혔|낯설/, q:['진행하면서 가장 어려웠던 순간은 언제였나요?','예상과 다르게 흘러간 일이 있었나요?'] },
  { re:/시도|해결|바꿨|만들|제안|정리|분석|설계/, q:['그 어려움을 넘기 위해 구체적으로 어떤 행동을 했나요?','내가 직접 제안하거나 바꾼 것이 있었나요?'] },
  { re:/달라|변화|성장|배웠|배운|깨달|느꼈|알게/, q:['이 경험 전과 후로 나에게서 달라진 점은 무엇인가요?','이 경험에서 배운 것을 하나만 꼽는다면요?'] },
  { re:/기억|순간|뿌듯|기뻤|인상|감동/, q:['가장 기억에 남는 장면 하나를 떠올려 볼까요?','그때 어떤 기분이 들었나요?'] },
];
const TAG_Q = {
  '리더십':'팀을 이끌며 내렸던 결정 중 가장 고민했던 것은 무엇인가요?',
  '데이터 분석':'데이터에서 발견한 가장 의미 있는 사실은 무엇이었나요?',
  '팀워크':'팀원과 의견이 달랐던 순간을 어떻게 풀었나요?',
  '발표':'발표를 준비하며 가장 신경 쓴 부분은 무엇이었나요?',
  '마케팅':'누구에게 무엇을 전하고 싶었나요? 타깃을 어떻게 정했나요?',
  '봉사':'함께한 사람들에게서 어떤 반응을 느꼈나요?',
  '기획':'처음 아이디어와 최종 결과는 어떻게 달라졌나요?',
  '문제 해결':'문제의 원인은 무엇이었고, 어떻게 알아냈나요?',
};
let askRound = 0;
function guideQuestions(text, tags){
  askRound++;
  if (text.trim().length < 15) return ['언제, 어디서, 누구와 함께한 일인가요?','그 일을 시작하게 된 계기는 무엇이었나요?','지금 떠오르는 장면 하나를 그대로 적어 볼까요?'];
  const out = ASPECTS.filter(a => !a.re.test(text)).map(a => a.q[askRound % a.q.length]);
  const tq = tags.map(t => TAG_Q[t]).filter(Boolean);
  if (tq.length) out.splice(1, 0, tq[askRound % tq.length]);
  if (!out.length) out.push('이 경험이 지금의 나에게 어떤 의미로 남아 있나요?', '다시 한다면 무엇을 다르게 해 보고 싶나요?');
  return out.slice(0, 3);
}

}

function radarSVG(rows, max){
  const N = rows.length, R = 128, cx = 220, cy = 190;
  const pt = (i, f) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; };
  const poly = rows.map((r, i) => pt(i, Math.max(.06, r.points / max)).map(v => v.toFixed(1)).join(',')).join(' ');
  let s = `<svg class="radar" viewBox="0 0 440 380" role="img" aria-label="능력치 레이더 차트" style="width:100%;max-width:460px;display:block;margin:auto">
    <defs><linearGradient id="rd-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6bff" stop-opacity=".55"/><stop offset="1" stop-color="#3fd6a6" stop-opacity=".3"/></linearGradient>
    <linearGradient id="rd-s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b95ff"/><stop offset="1" stop-color="#3fd6a6"/></linearGradient>
    <filter id="rd-g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter></defs>`;
  for (const f of [.25, .5, .75, 1]) s += `<circle class="grid" cx="${cx}" cy="${cy}" r="${R * f}" ${f < 1 ? 'stroke-dasharray="2 5"' : ''}/>`;
  rows.forEach((_, i) => { const [x, y] = pt(i, 1); s += `<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; });
  s += `<polygon points="${poly}" fill="#3f8cff" fill-opacity=".45" filter="url(#rd-g)"/>`;
  s += `<polygon points="${poly}" fill="url(#rd-f)" stroke="url(#rd-s)" stroke-width="2.5" stroke-linejoin="round"/>`;
  rows.forEach((r, i) => { const [x, y] = pt(i, Math.max(.06, r.points / max)); s += `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" style="filter:drop-shadow(0 0 6px #6aa8ff)"/>`; });
  rows.forEach((r, i) => {
    const [x, y] = pt(i, 1.17); const anchor = Math.abs(x - cx) < 10 ? 'middle' : x > cx ? 'start' : 'end';
    s += `<text x="${x}" y="${y}" text-anchor="${anchor}" font-weight="600" fill="#e6eaf2">${esc(r.name.length > 9 ? r.name.slice(0, 8) + '…' : r.name)}</text>`;
    s += `<text x="${x}" y="${y + 15}" text-anchor="${anchor}" font-size="11" fill="rgba(245,245,247,.55)">${fmtPts(r.points)}</text>`;
  });
  return s + '</svg>';
}

const TL_COLORS = ['#6aa8ff', '#ffe59a', '#c6f4a3', '#ffb3c6', '#a3efe3'];
function monthsBetween(a, b){ const out = []; let y = +a.slice(0, 4), m = +a.slice(5, 7); const ey = +b.slice(0, 4), em = +b.slice(5, 7);
  while (y < ey || (y === ey && m <= em)) { out.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } } return out; }
// Smooth step: each rise eases in and out, so the line never overshoots a count.
function smoothPath(pts){
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2;
    d += y0 === y1 ? `L${x1.toFixed(1)},${y1.toFixed(1)}` : `C${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }

}

  const list = [...state.experiences].sort((a, b) => a.date < b.date ? -1 : 1);
  const last = list[list.length - 1].date.slice(0, 7), now = today().slice(0, 7);
  const months = monthsBetween(list[0].date.slice(0, 7), last > now ? last : now);
  const tagRows = allTags().sort((a, b) => b.exps.length - a.exps.length).slice(0, 5);
  const series = tagRows.map(t => { let c = 0; return months.map(m => (c += t.exps.filter(e => e.date.slice(0, 7) === m).length)); });
  const W = 920, ml = 36, mr = 132, mt = 18, ih = 220, iw = W - ml - mr, beadY = mt + ih + 34, H = beadY + 56;
  const ymax = Math.max(2, ...series.flat());
  const x = i => ml + (months.length === 1 ? iw / 2 : i * iw / (months.length - 1));
  const y = v => mt + ih - v / ymax * ih;
  const step = months.length > 1 ? iw / (months.length - 1) : iw;
  let svg = `<svg class="tl-chart" id="tl-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="많이 등장한 태그 ${tagRows.length}개의 누적 경험 수 변화와 경험 별"><defs>
    ${TL_COLORS.map((c, k) => `<linearGradient id="tl-a${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".26"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>`).join('')}
    <filter id="tl-glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs>`;
  const bands = []; months.forEach((m, i) => { const s = semOf(m + '-01'); if (!bands.length || bands[bands.length - 1].key !== s.key) bands.push({ ...s, i0: i, i1: i }); else bands[bands.length - 1].i1 = i; });
  bands.forEach((b, k) => {
    const x0 = Math.max(ml - 10, x(b.i0) - step / 2), x1 = Math.min(ml + iw + 10, x(b.i1) + step / 2);
    if (k % 2 === 0) svg += `<rect x="${x0}" y="${mt - 6}" width="${Math.max(0, x1 - x0)}" height="${beadY - mt + 22}" rx="10" fill="#fff" fill-opacity=".04"/>`;
    if (x1 - x0 > 34) svg += `<text x="${(x0 + x1) / 2}" y="${H - 8}" text-anchor="middle" fill="rgba(245,245,247,.5)">${b.short}</text>`;
  });
  for (let v = 0; v <= ymax; v += Math.ceil(ymax / 4)) svg += `<line x1="${ml}" x2="${ml + iw}" y1="${y(v)}" y2="${y(v)}" stroke="#fff" stroke-opacity=".08" stroke-dasharray="2 4"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end" fill="rgba(245,245,247,.45)">${v}</text>`;

  series.forEach((s, k) => { svg += `<path d="${paths[k]}" fill="none" stroke="${TL_COLORS[k]}" stroke-width="7" stroke-opacity=".35" filter="url(#tl-glow)"/>`; });

  if (dear) out.push(`‘${esc(dear.title)}’처럼 역량보다 삶에서 소중했던 경험도 당신의 별자리를 이루고 있어요.`);

function applyProfile(name, m1, m2){
  const p = state.profile; p.name = name;
  const old = p.majors.map(m => m.name);
  p.majors = [m1 && { name: m1, role: '주전공' }, m2 && { name: m2, role: '이중전공' }].filter(Boolean);
  for (const m of p.majors) if (!old.includes(m.name) && !state.categories.some(c => c.group === m.name)) state.categories.push({ id: uid(), name: m.name, group: m.name, keywords: hintKeywords(m.name) });
}
function openSplit(c){
  const layer = openModal(`
    <div class="sheet-head"><h2>‘${esc(c.name)}’ 나누기</h2><button class="icon-btn" data-close aria-label="닫기">×</button></div>

      <p style="color:var(--fg-2);font-size:15px">세부 분야를 쉼표로 구분해 적어 주세요. 능력치와 요약에서 각각 따로 보여 드려요.</p>
      <input class="input" id="sp-in" placeholder="예: 산업, 경영, 공학">
    </div>
    <div class="sheet-foot"><button class="btn btn-quiet" data-close>취소</button><button class="btn btn-primary" id="sp-ok">나누기</button></div>`, 'narrow');

  $('#sp-ok', layer).onclick = () => {
    const parts = uniq($('#sp-in', layer).value.split(/[,·、/]/).map(s => s.trim()).filter(Boolean));
    if (parts.length < 2) { toast('두 개 이상으로 나눠 주세요.'); return; }
    if (commit(() => { const i = state.categories.indexOf(c); state.categories.splice(i, 1, ...parts.map(n => ({ id: uid(), name: n, group: c.group, keywords: hintKeywords(n) }))); })) { closeModal(); toast(`${parts.length}개 분야로 나눴어요.`); renderMe(); }
  };
}
async function exportData(){
  const data = JSON.stringify(state, null, 1);
  const name = `MYkrokosmos_백업_${today()}.json`;
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({ filename: name, data }); toast('백업 파일을 저장했어요.'); return; }
    catch (e) { if (e && e.code === 'declined') { toast('저장을 취소했어요.'); return; } if (e && e.code === 'rate_limited') { toast('잠시 후 다시 시도해 주세요.'); return; } }
  }
  $('#me-export-box').hidden = false; $('#me-export-text').value = data; $('#me-export-text').select();
}
async function importData(ev){
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.experiences) || !d.profile) throw 0;
    if (!await ask(`이 파일의 경험 ${d.experiences.length}개로 지금 기록을 바꿀까요? 지금 기록은 사라져요.`, '불러오기')) return;
    const merged = { ...emptyState(), ...d, tutorialDone: true };
    if (commit(() => { state = merged; })) { posCache.clear(); toast('백업을 불러왔어요.'); go('graph'); }
  } catch { toast('백업 파일을 읽지 못했어요. 이 서비스에서 내보낸 .json 파일인지 확인해 주세요.'); }
}

let tourI = 0, tourFresh = false;
function startTour(fresh){
  tourFresh = fresh;
  realState = state;
  demo = true; state = makeSample(); posCache.clear(); pinCache.clear(); zoomT = null; userZoomed = false; panelNode = null;
  closeModal(); tourI = 0;
  go('graph');   // redraw now: the sky on screen still shows the viewer's own (often empty) data
  document.documentElement.classList.add('touring');
  $('#tour-root').innerHTML = `<div class="tour" role="dialog" aria-modal="true" aria-labelledby="tour-title"><div class="tour-spot" id="tour-spot"></div><div class="tour-card" id="tour-card"></div></div>`;
  showStep();
}
function showStep(){
  const s = TOUR[tourI];
  if (s.view && s.view !== view) go(s.view);
  else if (!s.view && view !== 'graph') go('graph');
  const card = $('#tour-card'), spot = $('#tour-spot');
  $('.tour').classList.toggle('pass', !!s.explore);
  card.innerHTML = `<h3 id="tour-title">${s.title}</h3><p>${s.text}</p><div class="tour-foot"><span class="prog">${tourI + 1} / ${TOUR.length}</span>
    ${s.last ? '' : '<button class="link" id="t-skip" style="font-size:14px;color:var(--fg-3)">건너뛰기</button>'}
    ${tourI ? '<button class="btn btn-quiet btn-sm" id="t-prev">이전</button>' : ''}
    <button class="btn btn-primary btn-sm" id="t-next">${s.last ? (tourFresh ? '내 별자리 시작하기' : '돌아가기') : tourI ? '다음' : '둘러보기'}</button></div>`;
  $('#t-next').onclick = () => s.last ? endTour() : (tourI++, showStep());
  const pv = $('#t-prev'); if (pv) pv.onclick = () => { tourI--; showStep(); };
  const sk = $('#t-skip'); if (sk) sk.onclick = endTour;
  $('#t-next').focus();
  setTimeout(placeStep, 60);
}
function placeStep(){
  const s = TOUR[tourI], card = $('#tour-card'), spot = $('#tour-spot'); if (!card) return;
  const vw = innerWidth, vh = innerHeight, cw = card.offsetWidth, ch = card.offsetHeight;
  const t = s.target && $(s.target);
  if (!t) { spot.style.cssText = `top:${vh / 2}px;left:${vw / 2}px;width:0;height:0`; card.style.top = (vh - ch) / 2 + 'px'; card.style.left = (vw - cw) / 2 + 'px'; return; }
  const r0 = t.getBoundingClientRect();
  if (r0.top < 60 || r0.bottom > vh) { window.scrollTo({ top: scrollY + r0.top - 80 }); }
  const r = t.getBoundingClientRect(), pad = 8;
  const top = Math.max(4, r.top - pad), bottom = Math.min(vh - 4, r.bottom + pad);
  spot.style.cssText = `top:${top}px;left:${r.left - pad}px;width:${r.width + pad * 2}px;height:${bottom - top}px`;
  let ct, cl = clamp(r.left + r.width / 2 - cw / 2, 16, vw - cw - 16);
  if (bottom + ch + 16 < vh) ct = bottom + 12;
  else if (top - ch - 16 > 0) ct = top - ch - 12;
  else { ct = vh - ch - 24; cl = clamp(r.right - cw - 24, 16, vw - cw - 16); }
  card.style.top = ct + 'px'; card.style.left = cl + 'px';
}
addEventListener('resize', () => { if ($('#tour-card')) placeStep(); });
// While the tour runs, the viewer can't scroll or zoom away from the highlighted area.
const touring = () => document.documentElement.classList.contains('touring');
const blockScroll = e => { if (touring()) e.preventDefault(); };
// On an explore step the spotlighted sky stays usable (drag, zoom, click a star); everything else stays blocked.
const exploreSel = () => touring() && TOUR[tourI] && TOUR[tourI].explore;
const guardOutside = e => {
  const sel = exploreSel();
  if (!sel || e.target.closest(sel) || e.target.closest('#tour-card')) return;
  e.preventDefault(); e.stopPropagation();
};
for (const t of ['pointerdown', 'mousedown', 'touchstart', 'click', 'dblclick']) addEventListener(t, guardOutside, { capture: true, passive: false });
addEventListener('wheel', blockScroll, { passive: false, capture: true });
addEventListener('touchmove', blockScroll, { passive: false, capture: true });
addEventListener('keydown', e => {
  if (!touring()) return;
  const keys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'];
  if (keys.includes(e.key) || (e.key === ' ' && !e.target.closest('button'))) e.preventDefault();
}, { capture: true });
function endTour(){
  $('#tour-root').innerHTML = '';
  document.documentElement.classList.remove('touring');
  demo = false; posCache.clear(); pinCache.clear(); zoomT = null; userZoomed = false; panelNode = null;
  state = realState || emptyState(); realState = null;
  state.tutorialDone = true; save();
  go('graph');
}

/* ================= BOOT ================= */
if (!storageOK) $('#storage-banner').hidden = false;
const saved = load();
if (saved) state = { ...emptyState(), ...saved };
const begin = () => {
  if (!state.tutorialDone) startTour(!state.experiences.length);
  else { const v = recall('view'); go(RENDER[v] ? v : 'graph'); }
};
go('graph');
if (!state.profile.name) openWelcome(begin); else begin();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (view === 'graph') drawGraph(); }, 200); });
})();
</script>
